apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-analytics-frontend
  namespace: default
  labels:
    app: log-analytics-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: log-analytics-frontend
  template:
    metadata:
      labels:
        app: log-analytics-frontend
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: REPLACE_ECR_REGISTRY/log-frontend:REPLACE_IMAGE_TAG
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: log-analytics-frontend
  namespace: default
spec:
  type: LoadBalancer
  selector:
    app: log-analytics-frontend
  ports:
    - name: http
      port: 80
      targetPort: http

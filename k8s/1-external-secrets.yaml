apiVersion: v1
kind: ServiceAccount
metadata:
  name: log-analytics-eso
  namespace: default
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::REPLACE_ACCOUNT_ID:role/log-analytics-external-secrets
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: default
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1
      auth:
        jwt:
          serviceAccountRef:
            name: log-analytics-eso
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: log-analytics-secrets
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: log-analytics-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: prod/log-analytics/env
